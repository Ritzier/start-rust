name: Test Template
on:
  push:
    branches: [main, cargo-generate]
  pull_request:
    branches: [main]
  schedule:
    # Test weekly to catch dependency issues
    - cron: '0 18 * * 5'
jobs:
  test-template:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project_type: [cli]
        use_tokio: [true, false]
    steps:
      - name: Checkout template
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-generate
        run: cargo install cargo-generate
      - name: Generate project
        run: |
          cargo generate --path . \
            --name test-${{ matrix.project_type }}-tokio-${{ matrix.use_tokio }} \
            --define project_type=${{ matrix.project_type }} \
            --define use_tokio=${{ matrix.use_tokio }} \
            --silent
      # Move generated project to avoid cargo workspace conflicts
      - name: Test generated project
        run: |
          PROJECT_NAME="test-${{ matrix.project_type }}-tokio-${{ matrix.use_tokio }}"
          mv $PROJECT_NAME ${{ runner.temp }}/
          cd ${{ runner.temp }}/$PROJECT_NAME

          # Test compilation
          cargo check --verbose
          cargo build --verbose

          # Test basic functionality
          if [[ "${{ matrix.project_type }}" == "cli" ]]; then
            cargo run -- --help
            cargo run -- completions bash > /dev/null
          fi

          # Test formatting and linting
          cargo fmt -- --check
          cargo clippy -- -D warnings
